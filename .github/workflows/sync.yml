name: Sincronizar Google Sheets

on:
  schedule:
    # Executa a cada 1 hora
    - cron: '0 * * * *'
  workflow_dispatch: # Permite disparar manualmente pelo painel do GitHub

jobs:
  sync-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Baixar Respostas do Google Sheets e Sincronizar Supabase
        run: node execution/sync_sheets.js
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}

      - name: Commit e Push se houver novos dados
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add src/data/checklist_data.csv
          if git diff --staged --quiet; then
            echo "Nenhuma alteração nos dados do checklist."
          else
            git commit -m "chore(data): sincronização automática com Google Sheets [skip ci]"
            git push
          fi
